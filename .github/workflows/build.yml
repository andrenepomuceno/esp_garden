name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-native-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # No board and no data/config.json needed: [env:native] builds only the
      # sources that compile without the Arduino core.
      - name: Check file sizes
        # The 1000-line rule sat in CLAUDE.md unenforced long enough for two
        # files to cross it unnoticed. Running the gate by hand is the honour
        # system with extra steps, so it runs here — before the tests, because
        # it takes a second and answers a question the tests never ask.
        run: python scripts/check_lines.py

      - name: Run unit tests
        run: pio test -e native

  build:
    name: Build firmware
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [espgarden1, espgarden2, espgarden3, espgarden4, espgarden5,
                      espgarden_s3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Provision config.json
        # Per board, because the filesystem image carries whatever
        # data/config.json holds. One template for every env would ship an
        # espgarden_s3 artifact whose relays sit on GPIO 15-18 — pins that
        # board uses for its flow input, its float switch and its button — and
        # whose probes sit on GPIO 32-36, which are its SPI flash and PSRAM.
        run: |
          if [ "${{ matrix.environment }}" = "espgarden_s3" ]; then
            cp templates/config.espgarden_s3.json data/config.json
          else
            cp data/config.template.json data/config.json
          fi

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Build SPIFFS image
        run: pio run -e ${{ matrix.environment }} -t buildfs

      - name: Prepare release artifacts
        run: |
          mkdir -p artifacts
          cp .pio/build/${{ matrix.environment }}/firmware.bin \
             artifacts/esp-garden-${{ matrix.environment }}-firmware.bin
          cp .pio/build/${{ matrix.environment }}/littlefs.bin \
             artifacts/esp-garden-${{ matrix.environment }}-littlefs.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-garden-${{ matrix.environment }}
          path: artifacts/*
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/esp-garden-${{ matrix.environment }}-firmware.bin
            artifacts/esp-garden-${{ matrix.environment }}-littlefs.bin
