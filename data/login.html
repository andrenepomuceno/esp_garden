<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="bootstrap.css" rel="stylesheet">
  <title>Sign in — ESP Garden</title>
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-card {
      width: 100%;
      max-width: 22rem;
    }
  </style>
</head>

<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="card-body">
        <h1 class="fs-4 mb-3 text-center">&#x1F331; ESP Garden</h1>

        <div id="status"></div>

        <form id="login-form" autocomplete="on">
          <div class="mb-2">
            <label for="input-username" class="form-label small mb-1">Username</label>
            <input type="text" class="form-control form-control-sm" id="input-username" name="username"
              autocomplete="username" autofocus required>
          </div>

          <div class="mb-2">
            <label for="input-password" class="form-label small mb-1">Password</label>
            <input type="password" class="form-control form-control-sm" id="input-password" name="password"
              autocomplete="current-password" required>
          </div>

          <div class="form-check form-switch mb-3">
            <input id="input-remember" class="form-check-input" type="checkbox">
            <label class="form-check-label small" for="input-remember">Stay signed in on this device</label>
          </div>

          <div class="d-grid">
            <button id="button-login" type="submit" class="btn btn-primary btn-sm">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="jquery.js"></script>
  <script src="sha256.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>

</html>
