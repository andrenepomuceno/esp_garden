<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
  <title>Configuration — ESP Garden</title>
  <style>
    body { padding-bottom: 2rem; }
    .card { margin-bottom: 1rem; }
    .card-header { font-weight: 600; padding: .5rem .75rem; }
    .card-body { padding: .75rem; }
    .form-label { margin-bottom: .15rem; }
    .field-row { margin-bottom: .6rem; }
    .table td, .table th { padding: .35rem .4rem; vertical-align: middle; }
    .hint { font-size: .78rem; }
    /* Keeps the tab strip usable if the Bootstrap CSS on the CDN is
       unreachable — the page still has to work with the WAN down. */
    #config-tabs { display: flex; flex-wrap: wrap; gap: .25rem; list-style: none; padding-left: 0; }
    #config-tabs .nav-link { cursor: pointer; }
    #config-tabs .nav-link.active { font-weight: 600; }
  </style>
</head>

<body>
  <div class="container py-3" style="max-width: 820px;">

    <header class="d-flex flex-wrap align-items-center justify-content-between mb-3">
      <h1 class="m-0 fs-4">&#x2699; Configuration</h1>
      <div class="small">
        <a href="/" class="link-primary">Dashboard</a>
        <a href="/history.html" class="link-primary ms-2">History</a>
        <a href="/devices.html" class="link-primary ms-2">Devices</a>
        <a href="/schedules.html" class="link-primary ms-2">Schedules</a>
        <a href="/users.html" class="link-primary ms-2">Users</a>
        <a href="/update.html" class="link-primary ms-2">Update</a>
        <a href="#" id="a-logout" class="link-primary ms-2">Logout</a>
      </div>
    </header>

    <div id="status"></div>

    <div class="alert alert-secondary hint">
      Secrets are shown as <code>********</code> and never leave the device.
      Leave a masked field untouched to keep its stored value; type a new one to
      replace it. Changes take effect after a restart.
    </div>

    <form id="config-form" autocomplete="off">
      <div id="sections"></div>

      <div class="d-flex gap-2 flex-wrap">
        <button id="button-save" type="submit" class="btn btn-primary btn-sm" disabled>Save</button>
        <button id="button-reload" type="button" class="btn btn-outline-secondary btn-sm">Reload</button>
        <button id="button-restart" type="button" class="btn btn-outline-danger btn-sm">Restart device</button>
      </div>
    </form>

  </div>

  <script src="jquery.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
    crossorigin="anonymous"></script>
  <script src="auth.js"></script>
  <script src="config.js"></script>
</body>

</html>
