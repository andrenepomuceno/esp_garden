<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="bootstrap.css" rel="stylesheet">
  <title>Users — ESP Garden</title>
  <style>
    body { padding-bottom: 2rem; }
    .card { margin-bottom: 1rem; }
    .card-header { font-weight: 600; padding: .5rem .75rem; }
    .card-body { padding: .75rem; }
    .table td, .table th { padding: .4rem .5rem; vertical-align: middle; }
    .hint { font-size: .78rem; }
  </style>
</head>

<body>
  <div class="container py-3" style="max-width: 720px;">

    <header class="d-flex flex-wrap align-items-center justify-content-between mb-3">
      <h1 class="m-0 fs-4">&#x1F464; Users</h1>
      <div class="small">
        <a href="/" class="link-primary">Dashboard</a>
        <a href="/history.html" class="link-primary ms-2">History</a>
        <a href="/devices.html" class="link-primary ms-2">Devices</a>
        <a href="/schedules.html" class="link-primary ms-2">Schedules</a>
        <a href="/config.html" class="link-primary ms-2">Config</a>
        <a href="/update.html" class="link-primary ms-2">Update</a>
        <a href="#" id="a-logout" class="link-primary ms-2">Logout</a>
      </div>
    </header>

    <div id="status"></div>

    <div class="card">
      <div class="card-header">Accounts</div>
      <div class="card-body p-0">
        <table class="table table-sm table-striped mb-0">
          <thead>
            <tr><th>Username</th><th>Role</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody id="tbody-users"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Add or update</div>
      <div class="card-body">
        <form id="user-form" autocomplete="off">
          <div class="mb-2">
            <label for="input-username" class="form-label small mb-1">Username</label>
            <input type="text" class="form-control form-control-sm" id="input-username" required>
          </div>
          <div class="mb-2">
            <label for="input-password" class="form-label small mb-1">Password</label>
            <input type="password" class="form-control form-control-sm" id="input-password"
              autocomplete="new-password">
            <div class="form-text hint">
              Leave blank to change only the role of an existing account.
              Minimum 4 characters.
            </div>
          </div>
          <div class="mb-3">
            <label for="select-role" class="form-label small mb-1">Role</label>
            <select id="select-role" class="form-select form-select-sm">
              <option value="1">OPERATOR — dashboard and relays</option>
              <option value="2">ADMIN — also config, logs, OTA and users</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-sm">Save user</button>
        </form>
      </div>
    </div>

  </div>

  <script src="jquery.js"></script>
  <script src="auth.js"></script>
  <script src="users.js"></script>
</body>

</html>
