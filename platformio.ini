; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; A bare `pio run` builds these. [env:native] is deliberately excluded: it is a
; host test environment, not firmware, and building it as one fails on Unity's
; config header.
[platformio]
default_envs = espgarden1, espgarden2, espgarden3, espgarden4, espgarden5

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Stock default.csv caps each OTA slot at 1.31 MB, which the v2 firmware plus
; the authentication stack does not fit into. See the file's header for the
; sizing and for why this cannot be rolled out over OTA.
board_build.partitions = partitions/esp_garden_4mb.csv
; The image must be built with mklittlefs, not mkspiffs. Without this the
; firmware mounts a SPIFFS image as LittleFS, fails, and formats — silently
; taking /config.json with it. See include/core/filesystem.h for why LittleFS.
board_build.filesystem = littlefs
lib_deps =
	adafruit/DHT sensor library@^1.4.2
	; Pinned to the maintained fork. The old me-no-dev git URL now redirects
	; here anyway, so the previous untagged dependency silently tracked
	; whatever HEAD happened to be. 3.7+ is required for AsyncURIMatcher.
	ESP32Async/ESPAsyncWebServer@^3.7.8
	ESP32Async/AsyncTCP@^3.4.4
	marian-craciunescu/ESP32Ping@^1.7
	andrenepomuceno/CriticalTaskScheduler@^1.0.3
	arduino-libraries/Arduino_JSON@^0.2.0
	knolleary/PubSubClient@^2.8

; Which sensors and relays a board has is NOT here any more — it is in that
; device's config.json, editable from /devices.html without a rebuild. These
; environments differ only by the board they flash. See BuildConfig.h for why
; compiling every driver into every image costs 21 KB and is worth it.
[env:espgarden1]
board = nodemcu-32s
build_flags = -D ESPGARDEN1

[env:espgarden2]
board = esp32doit-devkit-v1
build_flags = -D ESPGARDEN2

[env:espgarden3]
board = esp32doit-devkit-v1
build_flags = -D ESPGARDEN3

[env:espgarden4]
board = esp32doit-devkit-v1
build_flags = -D ESPGARDEN4

; Host tests. Only code that compiles without the Arduino core belongs here —
; build_src_filter is an allow-list, so a new testable .cpp stays "undefined
; reference" until it gets a +<...> line.
;
; Run: pio test -e native            (all suites)
;      pio test -e native -f test_accumulator   (one; `native` is the ENV,
;                                                test_* is a FILTER)
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
lib_compat_mode = off
build_src_filter =
	-<*>
	+<accumulator_v2.cpp>
	+<fw_version.cpp>
	+<moisture_classifier.cpp>
build_flags =
	-D NATIVE_BUILD
	; Unity compiles its double assertions out by default, and a disabled
	; assertion FAILS rather than being skipped — which reads as a broken test
	; instead of a missing flag.
	-D UNITY_INCLUDE_DOUBLE
	-D UNITY_DOUBLE_PRECISION=1e-9
	-std=gnu++17
	-Wall
	-I include
lib_deps =
	throwtheswitch/Unity@^2.6.1

; Second-generation node. What it carries lives in its config.json; the pin
; rules it has to respect — analog on ADC1 only, relays off the strapping pins
; — are enforced at load by ConfigFile::validatePins() and mirrored by
; /devices.html before it lets you save.
[env:espgarden5]
board = esp32doit-devkit-v1
build_flags = -D ESPGARDEN5
