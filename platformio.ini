; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; A bare `pio run` builds these. [env:native] is deliberately excluded: it is a
; host test environment, not firmware, and building it as one fails on Unity's
; config header.
[platformio]
default_envs = espgarden1, espgarden2, espgarden3, espgarden4, espgarden5

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Stock default.csv caps each OTA slot at 1.31 MB, which the v2 firmware plus
; the authentication stack does not fit into. See the file's header for the
; sizing and for why this cannot be rolled out over OTA.
board_build.partitions = partitions/esp_garden_4mb.csv
lib_deps =
	adafruit/DHT sensor library@^1.4.2
	; Pinned to the maintained fork. The old me-no-dev git URL now redirects
	; here anyway, so the previous untagged dependency silently tracked
	; whatever HEAD happened to be. 3.7+ is required for AsyncURIMatcher.
	ESP32Async/ESPAsyncWebServer@^3.7.8
	ESP32Async/AsyncTCP@^3.4.4
	marian-craciunescu/ESP32Ping@^1.7
	andrenepomuceno/CriticalTaskScheduler@^1.0.3
	arduino-libraries/Arduino_JSON@^0.2.0
	knolleary/PubSubClient@^2.8

[env:espgarden1]
board = nodemcu-32s
; Water level is enabled because the board in the field already reports it —
; the flag was commented out during the "move firmware to root folder" repo
; reshuffle, not by a decision to drop the sensor. It owns ThingSpeak field 4.
build_flags =
	-D ESPGARDEN1
	-D HAS_MOISTURE_SENSOR
	-D HAS_LUMINOSITY_SENSOR
	-D HAS_DHT_SENSOR
	-D HAS_WATER_LEVEL_SENSOR
	-D HAS_FLOW_SENSOR
	-D HAS_FLOAT_SWITCH
	-D MOISTURE_SENSOR_COUNT=3
	-D RELAY_COUNT=4
	; Second probe stays off ThingSpeak: field 4 is the water level here, and
	; reusing a number rewrites the meaning of three years of stored data. Set
	; MOISTURE2_FIELD to publish it once a slot has been chosen.

[env:espgarden2]
board = esp32doit-devkit-v1
build_flags = -D ESPGARDEN2 -D HAS_LUMINOSITY_SENSOR

[env:espgarden3]
board = esp32doit-devkit-v1
build_flags = -D ESPGARDEN3 -D HAS_MOISTURE_SENSOR -D HAS_LUMINOSITY_SENSOR

[env:espgarden4]
board = esp32doit-devkit-v1
build_flags = -D ESPGARDEN4

; Host tests. Only code that compiles without the Arduino core belongs here —
; build_src_filter is an allow-list, so a new testable .cpp stays "undefined
; reference" until it gets a +<...> line.
;
; Run: pio test -e native            (all suites)
;      pio test -e native -f test_accumulator   (one; `native` is the ENV,
;                                                test_* is a FILTER)
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
lib_compat_mode = off
build_src_filter =
	-<*>
	+<accumulator_v2.cpp>
build_flags =
	-D NATIVE_BUILD
	-std=gnu++17
	-Wall
	-I include
lib_deps =
	throwtheswitch/Unity@^2.6.1

; Second-generation node: 2 soil probes, LDR, DHT11 and a 4-way relay board.
; The three analog channels must stay on ADC1 (GPIO 32-39) — ADC2 is unusable
; while WiFi is associated. Relay defaults avoid the strapping pins.
[env:espgarden5]
board = esp32doit-devkit-v1
build_flags =
	-D ESPGARDEN5
	-D HAS_MOISTURE_SENSOR
	-D MOISTURE_SENSOR_COUNT=2
	-D HAS_LUMINOSITY_SENSOR
	-D HAS_DHT_SENSOR
	-D RELAY_COUNT=4
