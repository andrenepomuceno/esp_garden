<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <title>ESP Garden &mdash; Update</title>
</head>

<body>
    <div class="container py-4" style="max-width: 640px;">
        <div class="d-flex align-items-center mb-3">
            <a href="/" class="link-primary me-3">&larr; Back</a>
            <h1 class="m-0">&#x1F4E6; Firmware Update</h1>
        </div>

        <div class="card mb-3">
            <div class="card-header py-2 fw-semibold">Upload</div>
            <div class="card-body">
                <form id="upload-form">
                    <label class="form-label fw-semibold small">Update Type</label>
                    <div class="btn-group w-100 mb-3" role="group" aria-label="Update type">
                        <input type="radio" class="btn-check" name="updateType" id="type-firmware" value="firmware"
                            autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="type-firmware">&#x1F4BB; Firmware</label>

                        <input type="radio" class="btn-check" name="updateType" id="type-filesystem"
                            value="filesystem" autocomplete="off">
                        <label class="btn btn-outline-primary" for="type-filesystem">&#x1F4C1; Filesystem</label>
                    </div>

                    <label for="file-input" class="form-label fw-semibold small">Select .bin file</label>
                    <input type="file" id="file-input" accept=".bin" class="form-control mb-3">

                    <button type="button" id="button-upload" class="btn btn-primary w-100 fw-semibold py-2">
                        &#x1F680; Upload
                    </button>
                </form>
            </div>
        </div>

        <div class="card" id="progress-card" style="display:none;">
            <div class="card-body">
                <label class="form-label small fw-semibold mb-1">Upload Progress</label>
                <div class="progress" style="height: 1.5rem;">
                    <div id="progress-bar"
                        class="progress-bar progress-bar-striped progress-bar-animated"
                        role="progressbar" style="width: 0%; transition: width .3s ease;">0%</div>
                </div>
                <div id="status" class="mt-2 text-center small"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/spark-md5@3.0.2/spark-md5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
    <script src="update.js"></script>
</body>

</html>
